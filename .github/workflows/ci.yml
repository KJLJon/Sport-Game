## @spec 001-initial-dev · @phase 0 · @task T-0.15 · @design 04-architecture.md §10, 12 §6
##
## Runs on every push and pull request. Typecheck, lint, the full unit suite with coverage
## thresholds, the traceability and PROGRESS checks, the bundle-size budget, and the Playwright
## E2E suite against a real static build under the deployed base path — because base-path and
## service-worker bugs only reproduce there.

name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint and format
        run: pnpm lint

      - name: Unit, determinism, property, and invariant tests
        run: pnpm test:coverage

      - name: Spec traceability (INV-15)
        run: pnpm trace

      - name: PROGRESS.md consistency
        run: pnpm progress:check

      - name: Traceability report is committed and current
        run: git diff --exit-code docs/traceability.md

      - name: Build
        run: pnpm build

      - name: Bundle-size budget (`12` §6)
        run: pnpm budget

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: verify

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build under the deployed base path
        run: pnpm build
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: PWA lifecycle, a11y, and smoke suites
        run: pnpm e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
